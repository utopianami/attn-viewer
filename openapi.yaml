        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: n
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 90
      responses:
        "200":
          description: Metric rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorMetricResponse"
