  /healthz:
    get:
      summary: Get Python QA engine health and enabled capabilities
      servers:
        - url: http://127.0.0.1:8801
      responses:
        "200":
          description: Engine health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineHealthResponse"
  /v1/answer:
    post:
      summary: Run the financial QA workflow and stream NDJSON events
      servers:
        - url: http://127.0.0.1:8801
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineAnswerRequest"
      responses:
        "200":
          description: A newline-delimited stream of EngineEvent objects, ending in final or error.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Each non-empty line is one JSON object matching EngineEvent.
        "422":
          description: FastAPI request validation error
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: attn_session
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
    BlogId:
      name: blogId
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 30
        pattern: "^[a-zA-Z0-9_-]{2,30}$"
    BlogArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^naver-[a-zA-Z0-9_-]{2,30}-[0-9]+$"
    BlogPostOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    BlogPostLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: Login required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    MarketReportEvidenceRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [card, news, metric, price] }
        id: { type: string }
        title: { type: string }
        ts: { type: string }
        excerpt: { type: string }
        source: { type: string }
        url: { type: string }
    MarketReportNumericFact:
      type: object
      required: [anchor_id, value]
      properties:
        anchor_id: { type: string }
        value: { type: number }
    MarketReportPipelineStage:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        note: { type: string }
        items:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { type: object, additionalProperties: true }
        io:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
    MarketReportClaim:
      type: object
      required: [claim_id, title, confidence, status]
      properties:
        claim_id: { type: string }
        title: { type: string }
        confidence: { type: string, enum: [낮, 중, 높] }
        status: { type: string, enum: [verified, unverified] }
        trigger: { type: string }
        mechanism: { type: string }
        evidence:
          type: array
          items: { type: string }
        evidence_refs:
          type: array
          items: { $ref: "#/components/schemas/MarketReportEvidenceRef" }
        anchor_refs:
          type: array
          items: { type: string }
        numeric_facts:
          type: array
          items: { $ref: "#/components/schemas/MarketReportNumericFact" }
        precedent: { type: string }
        precedent_grounded: { type: boolean }
        counter: { type: string }
        stance: { type: string }
        matched_rules:
          type: array
          items: { type: string }
        load_bearing: { type: boolean }
        as_of: { type: string }
    HistoryCase:
      type: object
      description: >-
        과거 시장 사례 학습 글(연도-테마). storage/rag/history_cases/<id>.json —
        세션에서 정리해 떨궈두면 히스토리 탭이 소비한다 (2026-08-05).
      required: [id, year, theme]
      properties:
        id: { type: string }
        year: { type: integer }
        theme: { type: string }
        title:
          type: string
          description: 비어 있으면 뷰어가 "연도 - 테마"로 표기.
        updatedAt: { type: string }
        body:
          type: string
          description: markdown 본문. 빈 문자열 = 내용 준비 중.
    MarketReport:
      type: object
      required: [id, seq, generatedAt, title, window, finalOpinion, claims, pipeline]
      properties:
        id: { type: string }
        seq: { type: integer }
        generatedAt: { type: string }
        title: { type: string }
        window: { type: object, additionalProperties: true }
        overview: { type: string }
        finalOpinion:
          type: object
          required: [text, confidence]
          properties:
            text: { type: string }
            confidence: { type: string, enum: [낮, 중, 높] }
        claims:
          type: array
          items: { $ref: "#/components/schemas/MarketReportClaim" }
        pipeline:
          type: object
          required: [stages]
          properties:
            stages:
              type: array
              items: { $ref: "#/components/schemas/MarketReportPipelineStage" }
        diagnostics: { type: object, additionalProperties: true }
        article:
          type: string
          description: Phase 4 완결 논증 글(markdown). 빈 문자열 = 미생성(강등).
        article_meta:
          type: object
          additionalProperties: true
          description: >-
            핵심 질문·지배 방정식·뼈대·조사 집계·미확인 수치 목록.
            semantic_audit({ok, problems[]}) 포함 — 제목·결론이 검증 범위 안인지
            LLM 감사 결과 (2026-07-24 발행 안전성).
        publish_status:
          type: string
          enum: [ok, hold]
          default: hold
          description: >-
            발행 안전성 상태(2026-07-24). legacy: hold = 검증 통과 주장 0건.
            axes: hold = 전 축 카드 실패.
        format:
          type: string
          enum: [legacy, axes]
          default: legacy
          description: >-
            v2 3축 카드(2026-07-24 재설계). axes면 cards가 결과물 본체 —
            claims·finalOpinion·article은 미사용(빈 값).
        editorial:
          $ref: "#/components/schemas/MarketReportEditorial"
        cards:
          type: array
          description: 3축 카드(매크로/메모리/그 외) — format=axes 전용.
          items: { $ref: "#/components/schemas/MarketReportAxisCard" }
    MarketReportEditorial:
      type: object
      additionalProperties: false
      required: [label, baseReportId, baseGeneratedAt, editedAt, headline, deck, takeaways]
      description: >-
        기존 리포트의 사실·근거·생성 과정을 유지한 채 읽기 순서와 시각적
        요약만 추가하는 편집 계층. baseReportId가 가리키는 원본은 별도 보존한다.
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        baseReportId: { type: string, minLength: 1, maxLength: 80 }
        baseGeneratedAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time }
        headline: { type: string, minLength: 1, maxLength: 100 }
        deck: { type: string, minLength: 1, maxLength: 240 }
        takeaways:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [axis, title, text]
            properties:
              axis: { type: string, enum: [macro, memory, other] }
              title: { type: string, minLength: 1, maxLength: 30 }
              text: { type: string, minLength: 1, maxLength: 180 }
    MarketReportAxisBrief:
      type: object
      additionalProperties: false
      required: [headline, summary, keyNumbers, flow, scenarioGuide, watchlist, bottomLine]
      description: 축의 원문 상세 분석을 대체하지 않는 선행 독서 가이드.
      properties:
        headline: { type: string, minLength: 1, maxLength: 100 }
        summary: { type: string, minLength: 1, maxLength: 320 }
        keyNumbers:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [label, value, context, tone]
            properties:
              label: { type: string, minLength: 1, maxLength: 30 }
              value: { type: string, minLength: 1, maxLength: 40 }
              context: { type: string, minLength: 1, maxLength: 80 }
              tone: { type: string, enum: [positive, negative, neutral, warning] }
        flow:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [label, detail, tone]
            properties:
              label: { type: string, minLength: 1, maxLength: 50 }
              detail: { type: string, minLength: 1, maxLength: 100 }
              tone: { type: string, enum: [positive, negative, neutral, warning] }
        scenarioGuide:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [polarity, condition, outcome]
            properties:
              polarity: { type: string, enum: [positive, negative] }
              condition: { type: string, minLength: 1, maxLength: 180 }
              outcome: { type: string, minLength: 1, maxLength: 180 }
        watchlist:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [label, current, trigger]
            properties:
              label: { type: string, minLength: 1, maxLength: 50 }
              current: { type: string, minLength: 1, maxLength: 120 }
              trigger: { type: string, minLength: 1, maxLength: 180 }
        bottomLine: { type: string, minLength: 1, maxLength: 240 }
    MarketReportAxisCard:
      type: object
      required: [axis]
      properties:
        axis: { type: string, enum: [macro, memory, other] }
        title: { type: string }
        brief:
          $ref: "#/components/schemas/MarketReportAxisBrief"
        phenomenon: { type: string, description: 현상 분석(markdown, 수치 라벨) }
        deep_dive:
          type: object
          additionalProperties: true
          description: "{topic, conclusion, findings[]} — 주제 선정 후 추가 연구"
        scenarios:
          type: array
          items:
            type: object
            required: [polarity, thesis]
            properties:
              polarity: { type: string, enum: [positive, negative] }
              thesis: { type: string }
              beneficiaries:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [sector, stock] }
                    direction: { type: string, enum: [direct, indirect] }
                    polarity: { type: string, enum: [benefit, damage] }
                    rationale: { type: string }
                    financials: { type: string }
        watch_signals:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { type: object, additionalProperties: true }
        error: { type: string, description: 축 실패 사유(빈 값=정상) }
    BlogListResponse:
      type: object
      required: [ok, blogs]
      properties:
        ok:
          type: boolean
          const: true
        blogs:
          type: array
          items:
            $ref: "#/components/schemas/BlogListItem"
    BlogListItem:
      type: object
      required: [id, name, source, tags, active, addedAt, count, recentCount]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]{2,30}$"
        name:
          type: string
        source:
          type: string
          enum: [naver]
        tags:
          type: array
          items:
            type: string
        active:
          type: boolean
        addedAt:
          type: string
          format: date-time
        crawlSince:
          type: string
          format: date-time
          description: Earliest Naver post publication time eligible for collection.
        count:
          type: integer
          minimum: 0
        recentCount:
          type: integer
          minimum: 0
        fetchBlocked:
          type: boolean
        latest:
          oneOf:
            - $ref: "#/components/schemas/BlogLatestPost"
            - type: "null"
        lastCheck:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        runningJob:
          oneOf:
            - $ref: "#/components/schemas/BlogRunningJob"
            - type: "null"
        lastJob:
          oneOf:
            - $ref: "#/components/schemas/BlogLastJob"
            - type: "null"
    BlogLatestPost:
      type: object
      required: [id, title, url, publishedAtText, fetchedAt]
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        publishedAtText:
          type: string
        fetchedAt:
          type: string
    BlogRunningJob:
      type: object
      required: [mode, startedAt]
      properties:
        mode:
          type: string
          enum: [backfill, refresh]
        startedAt:
          type: string
          format: date-time
    BlogLastJob:
      type: object
      required: [discovered, saved, failed, done, updatedAt]
      properties:
        discovered:
          type: integer
          minimum: 0
        saved:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        done:
          type: boolean
        updatedAt:
          type: string
    BlogCreateRequest:
      type: object
      additionalProperties: false
      required: [blogId]
      properties:
        blogId:
          type: string
          minLength: 2
          maxLength: 30
          pattern: "^[a-zA-Z0-9_-]{2,30}$"
        name:
          type: string
        crawlSince:
          type: string
          format: date-time
          description: Optional lower publication-time boundary for the initial crawl and later refreshes.
    BlogCreateResponse:
      type: object
      required: [ok, blog, preview, job]
      properties:
        ok:
          type: boolean
          const: true
        blog:
          $ref: "#/components/schemas/BlogRegistryItem"
        preview:
          $ref: "#/components/schemas/BlogPreview"
        job:
          $ref: "#/components/schemas/BlogJobStart"
    BlogRegistryItem:
      type: object
      required: [id, name, source, tags, active, addedAt]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          enum: [naver]
        tags:
          type: array
          items:
            type: string
        active:
          type: boolean
        addedAt:
          type: string
          format: date-time
        crawlSince:
          type: string
          format: date-time
          description: Earliest Naver post publication time eligible for collection.
    BlogPreview:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            type: object
            required: [logNo, title, nickName]
            properties:
              logNo:
                type: string
              title:
                type: string
              nickName:
                type: string
              publishedAt:
                type: string
                format: date-time
    BlogJobStart:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
        reason:
          type: string
          enum: [already-running]
    BlogPostsResponse:
      type: object
      required: [ok, total, posts]
      properties:
        ok:
          type: boolean
          const: true
        total:
          type: integer
          minimum: 0
        posts:
          type: array
          items:
            $ref: "#/components/schemas/BlogPost"
    BlogPost:
      type: object
      required: [id, blogId]
      properties:
        id:
          type: string
        blogId:
          type: string
        title:
          type: string
        author:
          type: string
        source:
          type: string
        url:
          type: string
        publishedAtText:
          type: string
        publishedAt:
          type: string
        fetchedAt:
          type: string
        contentHash:
          type: string
        markdownPath:
          type: string
        metadataPath:
          type: string
        imageCount:
          type: integer
          minimum: 0
        summary:
          type: [string, "null"]
        summaryReason:
          type: [string, "null"]
    BlogArticleResponse:
      type: object
      required: [ok, markdown, metadata]
      properties:
        ok:
          type: boolean
          const: true
        markdown:
          type: string
        metadata:
          oneOf:
            - $ref: "#/components/schemas/BlogArticleMetadata"
            - type: "null"
    BlogArticleMetadata:
      type: object
      required: [id, source, author, blogId, logNo, title, url, fetchedAt, contentHash]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [naver_blog]
        sourceReliability:
          type: string
          enum: [scraped]
        ingestMode:
          type: string
          enum: [crawl]
        fetchStatus:
          type: string
          enum: [ok]
        author:
          type: string
        blogId:
          type: string
        logNo:
          type: string
        title:
          type: string
        category:
          type: string
        url:
          type: string
        canonicalUrl:
          type: string
        publishedAtText:
          type: string
        fetchedAt:
          type: string
          format: date-time
        contentHash:
          type: string
        rawHtmlPath:
          type: string
        markdownPath:
          type: string
        imageCount:
          type: integer
          minimum: 0
        imageDownloadEnabled:
          type: boolean
        images:
          type: array
          items:
            type: object
            additionalProperties: true
        listItem:
          type: object
          additionalProperties: true
    EngineHealthResponse:
      type: object
      required: [ok, mode, capabilities, tools]
      properties:
        ok:
          type: boolean
          const: true
        mode:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        tools:
          type: object
          additionalProperties:
            type: boolean
    EngineAnswerRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        mode:
          type: string
          default: qa
        question:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/EngineHistoryTurn"
        run_id:
          type: string
          default: ""
        chat_id:
          type: string
          default: ""
        message_id:
          type: string
          default: ""
        providers:
          type: array
          default: []
          items:
            type: string
        think_level:
          type: integer
          default: 2
        model_mode:
          type: string
          enum: ["", fast, deep]
          default: ""
        model:
          type: string
          maxLength: 120
          default: ""
        user_id:
          type: string
          default: ""
    EngineHistoryTurn:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        plan_summary:
          type: [object, "null"]
          additionalProperties: true
        raw_layers:
          type: [object, "null"]
          additionalProperties: true
    EngineEvent:
      oneOf:
        - $ref: "#/components/schemas/EngineHeartbeatEvent"
        - $ref: "#/components/schemas/EngineLayerEvent"
        - $ref: "#/components/schemas/EngineProgressEvent"
        - $ref: "#/components/schemas/EngineFinalEvent"
        - $ref: "#/components/schemas/EngineErrorEvent"
      discriminator:
        propertyName: type
    EngineHeartbeatEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: heartbeat
    EngineLayerEvent:
      type: object
      additionalProperties: false
      required: [type, name, round, data, createdAt]
      properties:
        type:
          type: string
          const: layer
        name:
          type: string
        round:
          type: integer
          minimum: 0
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    EngineProgressEvent:
      type: object
      additionalProperties: false
      required: [type, stage, detail]
      properties:
        type:
          type: string
          const: progress
        stage:
          type: string
        detail:
          type: string
    EngineFinalEvent:
      type: object
      additionalProperties: false
      required: [type, answer, meta]
      properties:
        type:
          type: string
          const: final
        answer:
          type: string
        meta:
          type: object
          additionalProperties: true
    EngineErrorEvent:
      type: object
      additionalProperties: false
      required: [type, message, partial]
      properties:
        type:
          type: string
          const: error
        message:
          type: string
        partial:
          type: boolean
    ProxyErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SectorAxis:
      type: string
      enum: [A, A_prime, B, C, C0, E, P, market]
    SectorDirection:
      type: string
      enum: [pos, neg, neutral, mixed]
    SectorCard:
      type: object
      required:
        - id
        - ts
        - axis
        - entities
        - edge
        - event_type
        - memory_segment
        - direction
        - magnitude
        - time_horizon
        - source_grade
        - title
        - raw_quote
        - interpreted_signal
        - url
        - source
        - scheduled_date
        - scheduled_label
      properties:
        id:
          type: string
        ts:
          type: string
          description: ISO 8601 timestamp.
        axis:
          $ref: "#/components/schemas/SectorAxis"
        entities:
          type: array
          description: Canonical entity ids, for example SK_HYNIX or NVIDIA.
          items:
            type: string
        speaker:
          type:
            - string
            - "null"
        edge:
          type: string
          description: Sector edge such as B->A.
        event_type:
          type: string
          enum: [demand_signal, supply_signal, price_signal, earnings, filing, policy, speaker, product_policy, market_reaction]
        memory_segment:
          type: string
          enum: [hbm, dram, nand, mixed]
        direction:
          $ref: "#/components/schemas/SectorDirection"
        magnitude:
          type: integer
          minimum: 1
          maximum: 3
        time_horizon:
          type: string
          enum: [immediate, next_quarter, next_2_4_quarters]
        source_grade:
          type: string
          enum: [S, A, B, C, D]
        title:
          type: string
        raw_quote:
          type: string
          description: Source quote or factual source text.
        interpreted_signal:
          type: string
          description: Model interpretation kept separate from the raw quote.
        numeric:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        url:
          type: string
        source:
          type: string
        scheduled_date:
          type: string
          pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$"
          description: Future event date from the news item, or empty string.
        scheduled_label:
          type: string
          description: Short future event label, or empty string.
    SectorMetricObservation:
      type: object
      required: [metric, ts, value, unit, meta]
      properties:
        metric:
          type: string
        ts:
          type: string
          description: YYYY-MM-DD or YYYY-MM.
        value:
          type: number
        unit:
          type: string
        meta:
          type: object
          additionalProperties: true
        source:
          type: string
          description: Collector-attributed source label. Defaults to "" for backward compatibility with existing stored rows.
    SectorMetricResponse:
      type: object
      required: [metric, rows]
      properties:
        metric:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SectorMetricObservation"
    SectorCollectorStatus:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [ok, degraded, missing_key, error]
        at:
          type: string
        detail:
          type: string
    SectorStatusSummary:
      type: object
      required: [ok, degraded, missing_key, error]
      properties:
        ok:
          type: integer
        degraded:
          type: integer
        missing_key:
          type: integer
        error:
          type: integer
    SectorStatusResponse:
      type: object
      required: [collectors, summary, scheduler]
      properties:
        collectors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SectorCollectorStatus"
        summary:
          $ref: "#/components/schemas/SectorStatusSummary"
        scheduler:
          type: object
          required: [enabled, interval_s]
          properties:
            enabled:
              type: boolean
            interval_s:
              type: integer
    SectorCollectRequest:
      type: object
      required: [only]
      properties:
        only:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
    SectorCollectResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
