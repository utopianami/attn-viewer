    get:
      summary: List memory-sector thesis revisions with freshness
      responses:
        "200":
          description: Latest thesis revisions
          content:
            application/json:
              schema:
                type: object
                required: [theses]
                properties:
                  theses:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectorThesis"
  /v1/monitor/health:
    get:
      summary: Latest data-pipeline health check results (engine/monitor)
      responses:
        "200":
          description: >-
            Health report — available=false until first run. results[] carry
            check/pipeline/axis(stability|consistency|accuracy)/level(ok|warn|alert).
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                  age_s: { type: number, nullable: true }
                  at: { type: string }
                  worst: { type: string, enum: [ok, warn, alert] }
                  results:
                    type: array
                    items:
                      type: object
                      required: [check, pipeline, axis, level]
                      properties:
                        check: { type: string }
                        pipeline: { type: string }
                        axis: { type: string, enum: [stability, consistency, accuracy] }
                        level: { type: string, enum: [ok, warn, alert] }
                        detail: { type: string }
  /api/chats/{chatId}/cancel:
    post:
      summary: Cancel the answer currently running for a chat
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Cancellation was requested or stale running state was cleared
          content:
            application/json:
              schema:
                type: object
                required: [ok, aborted]
                properties:
                  ok:
                    type: boolean
                    const: true
                  aborted:
                    type: boolean
                    description: Whether a live engine request existed in this Node process and was aborted.
        "400":
          description: Invalid chat id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The chat has no answer currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Cancellation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
