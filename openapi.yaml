openapi: 3.1.0
info:
  title: attn-viewer API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/session:
    get:
      summary: Get current login session
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/version:
    get:
      summary: Get the deployed frontend version derived from index.html modification time
      responses:
        "200":
          description: Current frontend version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
        "500":
          description: Frontend version could not be read
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: "null"
  /kg:
    get:
      summary: Open the public case-memory knowledge viewer
      responses:
        "200":
          description: Knowledge viewer HTML
          content:
            text/html:
              schema:
                type: string
  /api/kg/corpus:
    get:
      summary: List case-memory corpus files and their date coverage
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                type: object
                required: [ok, corpora]
                properties:
                  ok:
                    type: boolean
                    const: true
                  corpora:
                    type: array
                    items:
                      type: object
                      required: [file, docs, from, to]
                      properties:
                        file:
                          type: string
                        docs:
                          type: integer
                          minimum: 0
                        from:
                          type: string
                          description: Earliest document date, or an empty string when unavailable.
                        to:
                          type: string
                          description: Latest document date, or an empty string when unavailable.
        "500":
          description: Corpus statistics could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/kg/raw:
    get:
      summary: Find the source document containing a case-memory quote
      parameters:
        - name: q
          in: query
          required: true
          description: Normalized quote text; values shorter than 10 characters return ok=false.
          schema:
            type: string
      responses:
        "200":
          description: Quote lookup result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, error]
                    properties:
                      ok:
                        type: boolean
                        const: false
                      error:
                        type: string
                        const: quote too short
                  - type: object
                    required: [ok, found, corpusFile, matchType, date, source, url, excerpt]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      found:
                        type: boolean
                        const: true
                      corpusFile:
                        type: string
                      matchType:
                        type: string
                        enum: [exact, nospace]
                      date:
                        type: string
                      source:
                        type: string
                      url:
                        type: string
                      excerpt:
                        type: string
                  - type: object
                    required: [ok, found]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      found:
                        type: boolean
                        const: false
        "500":
          description: Quote lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/kg/rules:
    get:
      summary: List distilled case-memory rules
      responses:
        "200":
          description: Stored rules parsed from rules.jsonl
          content:
            application/json:
              schema:
                type: object
                required: [ok, count, rules]
                properties:
                  ok:
                    type: boolean
                    const: true
                  count:
                    type: integer
                    minimum: 0
                  rules:
                    type: array
                    description: JSONL records are returned without runtime shape validation.
                    items: {}
        "500":
          description: Stored rules could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/kg/cases:
    get:
      summary: List extracted case-memory episodes
      responses:
        "200":
          description: Stored episodes parsed from index.jsonl
          content:
            application/json:
              schema:
                type: object
                required: [ok, count, cases]
                properties:
                  ok:
                    type: boolean
                    const: true
                  count:
                    type: integer
                    minimum: 0
                  cases:
                    type: array
                    description: JSONL records are returned without runtime shape validation.
                    items: {}
        "500":
          description: Stored episodes could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/market-reports:
    get:
      summary: List generated market reports
      responses:
        "200":
          description: Market report metadata sorted newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, reports]
                properties:
                  ok:
                    type: boolean
                    const: true
                  reports:
                    type: array
                    items:
                      type: object
                      required: [id, claimCount]
                      properties:
                        id:
                          type: string
                        seq:
                          type: integer
                        generatedAt:
                          type: string
                        title:
                          type: string
                        window:
                          oneOf:
                            - type: object
                              additionalProperties: true
                            - type: "null"
                        claimCount:
                          type: integer
                          minimum: 0
        "500":
          description: Market report list could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/market-reports/{id}:
    get:
      summary: Get one generated market report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      responses:
        "200":
          description: Full market report payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, report]
                properties:
                  ok:
                    type: boolean
                    const: true
                  report:
                    $ref: "#/components/schemas/MarketReport"
        "400":
          description: Invalid report id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Market report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/history-cases:
    get:
      summary: List history study cases (year-theme past market cases)
      responses:
        "200":
          description: History case metadata sorted by year descending, then theme
          content:
            application/json:
              schema:
                type: object
                required: [ok, cases]
                properties:
                  ok:
                    type: boolean
                    const: true
                  cases:
                    type: array
                    items:
                      type: object
                      required: [id, year, theme, hasBody]
                      properties:
                        id:
                          type: string
                        year:
                          type: integer
                        theme:
                          type: string
                        title:
                          type: string
                        updatedAt:
                          type: string
                        hasBody:
                          type: boolean
        "500":
          description: History case list could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/history-cases/{id}:
    get:
      summary: Get one history study case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      responses:
        "200":
          description: Full history case payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, case]
                properties:
                  ok:
                    type: boolean
                    const: true
                  case:
                    $ref: "#/components/schemas/HistoryCase"
        "400":
          description: Invalid case id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: History case not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/login:
    post:
      summary: Login with a configured account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login succeeded
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Accounts are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/logout:
    post:
      summary: Clear current login session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/documents:
    get:
      summary: List current user's uploaded documents
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [ok, documents]
                properties:
                  ok:
                    type: boolean
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents/latest:
    get:
      summary: Get latest current-user document
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest document or null
          content:
            application/json:
              schema:
                type: object
                required: [ok, document]
                properties:
                  ok:
                    type: boolean
                  document:
                    oneOf:
                      - $ref: "#/components/schemas/Document"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents/{id}:
    get:
      summary: Get a current-user document by id
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, document]
                properties:
                  ok:
                    type: boolean
                  document:
                    $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update current-user document metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdateRequest"
      responses:
        "200":
          description: Updated document payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, document]
                properties:
                  ok:
                    type: boolean
                  document:
                    $ref: "#/components/schemas/Document"
        "400":
          description: Invalid document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a current-user document and generated files
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/pdf:
    get:
      summary: Get original PDF for a current-user document
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: PDF not found
  /api/documents/{id}/shares:
    post:
      summary: Create or reuse a public read-only share link for a current-user document
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/analyze:
    post:
      summary: Start a background Korean translation analysis job
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pages:
                  type: integer
                  minimum: 0
      responses:
        "202":
          description: Analysis job accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, job]
                properties:
                  ok:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/AnalysisJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Document already has a translation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/notes:
    get:
      summary: List current-user LLM notes for a document
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document notes
          content:
            application/json:
              schema:
                type: object
                required: [ok, notes]
                properties:
                  ok:
                    type: boolean
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/notes/ask:
    post:
      summary: Ask an LLM about selected text using the full English document and create a private note
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentNoteAskRequest"
      responses:
        "202":
          description: Private note created and LLM answer queued
          content:
            application/json:
              schema:
                type: object
                required: [ok, note]
                properties:
                  ok:
                    type: boolean
                  note:
                    $ref: "#/components/schemas/DocumentNote"
        "400":
          description: Invalid note request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/notes/{noteId}:
    get:
      summary: Get a current-user document note
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Document note
          content:
            application/json:
              schema:
                type: object
                required: [ok, note]
                properties:
                  ok:
                    type: boolean
                  note:
                    $ref: "#/components/schemas/DocumentNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document or note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a current-user document note
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Note deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document or note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/documents/{id}/notes/{noteId}/messages:
    post:
      summary: Add a follow-up question to a current-user document note
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentNoteMessageRequest"
      responses:
        "202":
          description: Follow-up question accepted and answer queued
          content:
            application/json:
              schema:
                type: object
                required: [ok, note]
                properties:
                  ok:
                    type: boolean
                  note:
                    $ref: "#/components/schemas/DocumentNote"
        "400":
          description: Invalid message request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Note already has a pending answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/analysis-jobs/{jobId}:
    get:
      summary: Get background translation analysis job status
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9-]+$"
      responses:
        "200":
          description: Analysis job status
          content:
            application/json:
              schema:
                type: object
                required: [ok, job]
                properties:
                  ok:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/AnalysisJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/uploads/pdf:
    post:
      summary: Upload and convert a PDF for the current user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf]
              properties:
                pdf:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload converted
          content:
            application/json:
              schema:
                type: object
                required: [ok, document]
                properties:
                  ok:
                    type: boolean
                  document:
                    $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Upload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/analysis-html:
    get:
      summary: List current user HTML analysis files
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Analysis HTML file list
          content:
            application/json:
              schema:
                type: object
                required: [ok, files]
                properties:
                  ok:
                    type: boolean
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalysisHtmlFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/analysis-html/{file}:
    get:
      summary: Get a current-user HTML analysis file
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
      responses:
        "200":
          description: HTML analysis file
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Bad file name
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
    delete:
      summary: Delete a current-user HTML analysis file
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
      responses:
        "200":
          description: Analysis HTML file deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Bad file name
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
  /api/analysis-html/{file}/shares:
    post:
      summary: Create or reuse a public share link for a current-user HTML analysis file
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
      responses:
        "200":
          description: Analysis HTML share payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, share]
                properties:
                  ok:
                    type: boolean
                  share:
                    $ref: "#/components/schemas/AnalysisHtmlShare"
        "400":
          description: Bad file name
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
  /api/analysis-html/{file}/chats:
    get:
      summary: List current-user LLM chat threads for an HTML analysis file
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
      responses:
        "200":
          description: Analysis HTML chat payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, chat]
                properties:
                  ok:
                    type: boolean
                  chat:
                    $ref: "#/components/schemas/AnalysisHtmlChat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
    post:
      summary: Create an LLM chat thread for an HTML analysis file
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: Created chat thread
          content:
            application/json:
              schema:
                type: object
                required: [ok, thread]
                properties:
                  ok:
                    type: boolean
                  thread:
                    $ref: "#/components/schemas/AnalysisHtmlChatThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
  /api/analysis-html/{file}/chats/{threadId}/messages:
    post:
      summary: Append a question to an HTML analysis LLM chat thread
      security:
        - cookieAuth: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[^/\\]+\\.html?$"
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 4000
                modelMode:
                  type: string
                  enum: [fast, deep]
      responses:
        "202":
          description: Question accepted and answer generation started
          content:
            application/json:
              schema:
                type: object
                required: [ok, thread]
